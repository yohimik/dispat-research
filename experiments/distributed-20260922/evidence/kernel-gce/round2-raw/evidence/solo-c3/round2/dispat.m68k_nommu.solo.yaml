# Generated by dispat/generate.py from the lists in master/master.cfg.
# Do not edit by hand: change the generator and run it again.
#
# One run tests one kernel revision, the one dispat/kernel/ref.env names.
# `kernel` is the package every cell of the matrix depends on, so a commit
#   feat(kernel)^^: test v7.3-rc4
# that changes ref.env puts every cell into the plan. A cell that passed is
# tagged and drops out of the next run; a cell that failed stays a candidate,
# so running again repeats the failures and nothing else.

logFormat: pretty
changelog: {enabled: false}
github: {enabled: false}
commit: {enabled: false}

# This history predates the commit convention dispat reads. Those commits
# contribute nothing and are counted rather than printed one by one.
parser: {quiet: true}

# A cell reads nothing the `kernel` package builds (it builds nothing), so
# every cell starts at once and only the records keep their order.
isBuildWaitingPublish: false

# Every cell runs on a worker. The machine that starts the run coordinates,
# records the results and spends no build slot of its own.
runOnly: orchestrator

scripts:
  build-cell: ../../run-cell.sh
  build-config-cell: ../../../run-cell.sh
  qemu-cell: ../../dispat/run-cell.sh

execution:
  role: orchestrator
  concurrency: 4
  secretEnv: DISPAT_EXECUTION_SECRET
  timeouts:
    preflight: 300
    # buildbot gives an image build 3600 s and a qemu target 1800 s
    task: 7200
    cancel: 120

packages:
  kernel:
    path: dispat/kernel
    runOnly: orchestrator
    isBuildWaitingPublish: {build: none}
  build-m68k_nommu-m5272c3_defconfig:
    path: dispat/build/m68k_nommu/m5272c3_defconfig
    dependencies: [kernel]
    flow: {build: build-config-cell}
    runOnly: orchestrator
    env: {"FARM_GCC_CURRENT": "16.2.0-2.47", "FARM_ARCH": "m68k_nommu", "FARM_CONFIG": "m5272c3_defconfig", "FARM_BUILD_JOBS": "8"}
  build-m68k_nommu-m5307c3_defconfig:
    path: dispat/build/m68k_nommu/m5307c3_defconfig
    dependencies: [kernel]
    flow: {build: build-config-cell}
    runOnly: orchestrator
    env: {"FARM_GCC_CURRENT": "16.2.0-2.47", "FARM_ARCH": "m68k_nommu", "FARM_CONFIG": "m5307c3_defconfig", "FARM_BUILD_JOBS": "8"}
  build-m68k_nommu-m5249evb_defconfig:
    path: dispat/build/m68k_nommu/m5249evb_defconfig
    dependencies: [kernel]
    flow: {build: build-config-cell}
    runOnly: orchestrator
    env: {"FARM_GCC_CURRENT": "16.2.0-2.47", "FARM_ARCH": "m68k_nommu", "FARM_CONFIG": "m5249evb_defconfig", "FARM_BUILD_JOBS": "8"}
  build-m68k_nommu-m5407c3_defconfig:
    path: dispat/build/m68k_nommu/m5407c3_defconfig
    dependencies: [kernel]
    flow: {build: build-config-cell}
    runOnly: orchestrator
    env: {"FARM_GCC_CURRENT": "16.2.0-2.47", "FARM_ARCH": "m68k_nommu", "FARM_CONFIG": "m5407c3_defconfig", "FARM_BUILD_JOBS": "8"}
  build-m68k_nommu-m5475evb_defconfig:
    path: dispat/build/m68k_nommu/m5475evb_defconfig
    dependencies: [kernel]
    flow: {build: build-config-cell}
    env: {"FARM_GCC_CURRENT": "16.2.0-2.47", "FARM_ARCH": "m68k_nommu", "FARM_CONFIG": "m5475evb_defconfig", "FARM_BUILD_JOBS": "12"}
