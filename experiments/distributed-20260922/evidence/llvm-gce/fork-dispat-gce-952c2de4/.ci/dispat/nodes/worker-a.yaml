  name: llvm-a
  endpoint: ssh://git@workers.example.invalid/llvm-a.git
  secretEnv: LLVM_DISPAT_EXECUTION_SECRET
  concurrency: 1
  workers: []
  timeouts: {preflight: 120, task: 86400, cancel: 300}
